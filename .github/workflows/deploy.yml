name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2 \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.11/Image-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PATH: /tmp/oci_private_key
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          export PATH="$HOME/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_private_key
          chmod 600 /tmp/oci_private_key
          
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=/tmp/oci_private_key
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF
          chmod 600 ~/.oci/config
          
          # Get namespace
          NAMESPACE=$(oci os ns get 2>/dev/null | jq -r '.data // empty') || NAMESPACE=""
          echo "Namespace: $NAMESPACE"
          
          # Create bucket
          echo "Creating bucket..."
          if [ -n "$NAMESPACE" ]; then
            oci os bucket create --namespace-name "$NAMESPACE" --name "nixos-images" --compartment-id "${OCI_TENANCY_OCID}" || echo "Bucket may already exist"
            
            # Upload image to bucket
            echo "Uploading NixOS image to bucket..."
            oci os object put --namespace-name "$NAMESPACE" --bucket-name "nixos-images" --name "nixos-aarch64.qcow2" --file "terraform/nixos-aarch64.qcow2" --force || echo "Image upload skipped"
          else
            echo "Could not determine namespace, skipping bucket creation"
          fi
          
          # Write terraform vars
          cat > terraform.tfvars << EOF
          tenancy_ocid = "$OCI_TENANCY_OCID"
          user_ocid = "$OCI_USER_OCID"
          fingerprint = "$OCI_FINGERPRINT"
          private_key_path = "/tmp/oci_private_key"
          compartment_ocid = "$OCI_TENANCY_OCID"
          region = "$OCI_REGION"
          subnet_id = "${SUBNET_ID:-}"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ocpus = ${OCPUS}
          memory_in_gbs = ${MEMORY_GB}
          EOF
          
          # Init and apply
          terraform init
          terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Instance IP: $(terraform output -raw instance_ip)"
