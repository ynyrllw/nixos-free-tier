name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2 \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.11/Image-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PATH: /tmp/oci_private_key
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          # Write private key to file
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_private_key
          chmod 600 /tmp/oci_private_key
          
          # Fail if SSH_PUBLIC_KEY is not set
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: SSH_PUBLIC_KEY is not set. Please add it as a GitHub Actions variable."
            exit 1
          fi
          
          SUBNET_ID_VAL="${SUBNET_ID:-}"
          cat > terraform.tfvars << EOF
          tenancy_ocid = "$OCI_TENANCY_OCID"
          user_ocid = "$OCI_USER_OCID"
          fingerprint = "$OCI_FINGERPRINT"
          private_key_path = "/tmp/oci_private_key"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$OCI_REGION"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ocpus = ${OCPUS}
          memory_in_gbs = ${MEMORY_GB}
          use_local_state = "false"
          EOF
          
          # Debug: show what vars are set
          echo "OCI_TENANCY_OCID is set: ${OCI_TENANCY_OCID:+yes}"
          echo "OCI_USER_OCID is set: ${OCI_USER_OCID:+yes}"
          echo "OCI_REGION is set: ${OCI_REGION:+yes}"
          echo "OCI_PRIVATE_KEY is set: ${OCI_PRIVATE_KEY:+yes}"
          echo "OCI_PRIVATE_KEY starts with: ${OCI_PRIVATE_KEY:0:30}"
          
          # Try to initialize with S3 backend first (if state exists in OCI)
          echo "Trying to initialize with S3 backend..."
          export AWS_ACCESS_KEY_ID="$OCI_TENANCY_OCID"
          export AWS_SECRET_ACCESS_KEY="$OCI_PRIVATE_KEY"
          terraform init -backend-config="bucket=nixos-images" -backend-config="key=terraform.tfstate" -backend-config="region=$OCI_REGION" -backend-config="endpoint=https://objectstorage.$OCI_REGION.oraclecloud.com" -backend-config="skip_credentials_validation=true" -backend-config="skip_metadata_api_check=true" -backend-config="force_path_style=true" && STATE_EXISTS=true || STATE_EXISTS=false
          
          if [ "$STATE_EXISTS" = "false" ]; then
            echo "No existing state in S3, initializing with local backend first..."
            # Re-init with local backend
            rm -rf .terraform*
            terraform init -backend=false
            
            # Import existing resources
            BUCKET_OCID=$(oci os bucket get --namespace-name "${OCI_TENANCY_OCID}" --name "nixos-images" --query 'data.id' --raw-output 2>/dev/null || true)
            if [ -n "$BUCKET_OCID" ]; then
              echo "Importing existing bucket: $BUCKET_OCID"
              terraform import 'oci_objectstorage_bucket.nixos_bucket' "$BUCKET_OCID" || true
            fi
            
            IMAGE_ID=$(oci compute image list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state AVAILABLE --display-name "NixOS ARM64" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$IMAGE_ID" ]; then
              echo "Importing existing image: $IMAGE_ID"
              terraform import 'oci_core_image.nixos' "$IMAGE_ID" || true
            fi
            
            INSTANCE_ID=$(oci compute instance list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state RUNNING --display-name "nixos" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$INSTANCE_ID" ]; then
              echo "Importing existing instance: $INSTANCE_ID"
              terraform import 'oci_core_instance.nixos' "$INSTANCE_ID" || true
            fi
            
            VCN_ID=$(oci network vcn list --compartment-id "${OCI_TENANCY_OCID}" --display-name "nixos-vcn" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$VCN_ID" ]; then
              echo "Importing existing VCN: $VCN_ID"
              terraform import 'oci_core_vcn.nixos' "$VCN_ID" || true
            fi
            
            SUBNET_ID=$(oci network subnet list --compartment-id "${OCI_TENANCY_OCID}" --display-name "nixos-subnet" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$SUBNET_ID" ]; then
              echo "Importing existing subnet: $SUBNET_ID"
              terraform import 'oci_core_subnet.nixos' "$SUBNET_ID" || true
            fi
            
            IG_ID=$(oci network internet-gateway list --compartment-id "${OCI_TENANCY_OCID}" --vcn-id "$VCN_ID" --display-name "nixos-ig" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$IG_ID" ]; then
              echo "Importing existing internet gateway: $IG_ID"
              terraform import 'oci_core_internet_gateway.nixos' "$IG_ID" || true
            fi
            
            RT_ID=$(oci network route-table list --compartment-id "${OCI_TENANCY_OCID}" --vcn-id "$VCN_ID" --display-name "nixos-rt" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$RT_ID" ]; then
              echo "Importing existing route table: $RT_ID"
              terraform import 'oci_core_route_table.nixos' "$RT_ID" || true
            fi
            
            SL_ID=$(oci network security-list list --compartment-id "${OCI_TENANCY_OCID}" --vcn-id "$VCN_ID" --display-name "nixos-sg" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$SL_ID" ]; then
              echo "Importing existing security list: $SL_ID"
              terraform import 'oci_core_security_list.nixos' "$SL_ID" || true
            fi
            
            # Migrate to S3 backend
            echo "Migrating to S3 backend..."
            terraform init -migrate-state -backend-config="bucket=nixos-images" -backend-config="key=terraform.tfstate" -backend-config="region=$OCI_REGION" -backend-config="endpoint=https://objectstorage.$OCI_REGION.oraclecloud.com" -backend-config="skip_credentials_validation=true" -backend-config="skip_metadata_api_check=true" -backend-config="force_path_style=true"
          fi
          
          # Apply changes
          terraform apply -auto-approve
          
          # Import route table
          RT_ID=$(oci network route-table list --compartment-id "${OCI_TENANCY_OCID}" --vcn-id "$VCN_ID" --display-name "nixos-rt" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$RT_ID" ]; then
            echo "Importing existing route table: $RT_ID"
            terraform import 'oci_core_route_table.nixos' "$RT_ID" || true
          fi
          
          # Import security list
          SL_ID=$(oci network security-list list --compartment-id "${OCI_TENANCY_OCID}" --vcn-id "$VCN_ID" --display-name "nixos-sg" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$SL_ID" ]; then
            echo "Importing existing security list: $SL_ID"
            terraform import 'oci_core_security_list.nixos' "$SL_ID" || true
          fi
          
          # Import shape management if exists
          if [ -n "$IMAGE_ID" ]; then
            SHAPE_ID="c/${OCI_TENANCY_OCID}/i/${IMAGE_ID}/s/VM.Standard.A1.Flex"
            echo "Importing shape management: $SHAPE_ID"
            terraform import 'oci_core_shape_management.nixos_a1_compat' "$SHAPE_ID" || true
          fi
          
          # Apply remaining changes
          terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
