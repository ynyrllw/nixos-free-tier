name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2 \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.11/Image-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PATH: /tmp/oci_private_key
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          # Write private key to file
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_private_key
          chmod 600 /tmp/oci_private_key
          
          SUBNET_ID_VAL="${SUBNET_ID:-}"
          cat > terraform.tfvars << EOF
          tenancy_ocid = "$OCI_TENANCY_OCID"
          user_ocid = "$OCI_USER_OCID"
          fingerprint = "$OCI_FINGERPRINT"
          private_key_path = "/tmp/oci_private_key"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$OCI_REGION"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ocpus = ${OCPUS}
          memory_in_gbs = ${MEMORY_GB}
          EOF
          
          # Debug: show what vars are set
          echo "OCI_TENANCY_OCID is set: ${OCI_TENANCY_OCID:+yes}"
          echo "OCI_USER_OCID is set: ${OCI_USER_OCID:+yes}"
          echo "OCI_REGION is set: ${OCI_REGION:+yes}"
          echo "OCI_PRIVATE_KEY is set: ${OCI_PRIVATE_KEY:+yes}"
          echo "OCI_PRIVATE_KEY starts with: ${OCI_PRIVATE_KEY:0:30}"
          
          # Try to initialize with S3 backend (if state exists, use it)
          terraform init -backend-config="hostname=objectstorage.${OCI_REGION}.oraclecloud.com" -backend-config="bucket_name=nixos-images-tfstate" -backend-config="key=nixos-deploy/terraform.tfstate" -backend-config="region=${OCI_REGION}" -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" -backend-config="user_ocid=${OCI_USER_OCID}" -backend-config="fingerprint=${OCI_FINGERPRINT}" -backend-config="private_key_path=/tmp/oci_private_key" && STATE_EXISTS=true || STATE_EXISTS=false
          
          if [ "$STATE_EXISTS" = "false" ]; then
            echo "No existing state found, checking for existing resources to import..."
            
            # Initialize without backend
            terraform init -backend=false
            
            # Import existing resources if they exist
            # Try to find and import existing NixOS image
            IMAGE_ID=$(oci compute image list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state AVAILABLE --display-name "NixOS ARM64" 2>/dev/null | grep -oP 'ocid1\.image\.oc1\.[a-z0-9.]+' | head -1 || true)
            if [ -n "$IMAGE_ID" ]; then
              echo "Importing existing image: $IMAGE_ID"
              terraform import 'oci_core_image.nixos' "$IMAGE_ID" || true
            fi
            
            # Try to find and import existing instance
            INSTANCE_ID=$(oci compute instance list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state RUNNING --display-name "nixos" 2>/dev/null | grep -oP 'ocid1\.instance\.oc1\.[a-z0-9.]+' | head -1 || true)
            if [ -n "$INSTANCE_ID" ]; then
              echo "Importing existing instance: $INSTANCE_ID"
              terraform import 'oci_core_instance.nixos' "$INSTANCE_ID" || true
            fi
            
            # Create or import state bucket
            BUCKET_EXISTS=$(oci os bucket get --namespace-name "${OCI_TENANCY_OCID}" --name "nixos-images-tfstate" 2>&1 || echo "NOT_FOUND")
            if echo "$BUCKET_EXISTS" | grep -q "ocid1\.bucket"; then
              BUCKET_OCID=$(echo "$BUCKET_EXISTS" | grep -oP 'ocid1\.bucket\.oc1\.[a-z0-9.]+' | head -1)
              terraform import 'oci_objectstorage_bucket.tfstate[0]' "$BUCKET_OCID" || true
            else
              terraform apply -target 'oci_objectstorage_bucket.tfstate[0]' -auto-approve || true
            fi
            
            # Migrate to S3 backend
            terraform init -migrate-state -backend-config="hostname=objectstorage.${OCI_REGION}.oraclecloud.com" -backend-config="bucket_name=nixos-images-tfstate" -backend-config="key=nixos-deploy/terraform.tfstate" -backend-config="region=${OCI_REGION}" -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" -backend-config="user_ocid=${OCI_USER_OCID}" -backend-config="fingerprint=${OCI_FINGERPRINT}" -backend-config="private_key_path=/tmp/oci_private_key"
          fi
          
          # Apply changes
          terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
