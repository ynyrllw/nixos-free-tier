name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'

jobs:
  build:
    runs-on: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v26
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update SSH key from secrets
        run: |
          mkdir -p nix-image
          cat > nix-image/configuration.nix << 'EOF'
          { config, pkgs, ... }: {
            system.stateVersion = "25.05";

            services.openssh = {
              enable = true;
              settings = {
                PasswordAuthentication = false;
                PermitRootLogin = "no";
              };
            };

            services.cloud-init.enable = true;

            networking.firewall = {
              enable = true;
              allowedTCPPorts = [ 22 ];
            };

            users.users.nixos = {
              isNormalUser = true;
              extraGroups = [ "wheel" ];
              openssh.authorizedKeys.keys = [
                "${{ vars.SSH_PUBLIC_KEY }}"
              ];
            };

            security.sudo.wheelNeedsPassword = false;
          }
          EOF

      - name: Build NixOS image
        run: nix build .#

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: result/nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          TENANCY_OCID: ${{ vars.TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          REGION: ${{ vars.REGION }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          REGION_VAL="${REGION:-}"
          cat > terraform.tfvars << 'ENDOFFILE'
          tenancy_ocid = "$TENANCY_OCID"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$REGION_VAL"
          subnet_id = "$SUBNET_ID"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ocpus = $OCPUS
          memory_in_gbs = $MEMORY_GB
          ENDOFFILE
          terraform init

      - name: Apply Terraform
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
