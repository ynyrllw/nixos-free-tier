name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2 \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.11/Image-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PATH: /tmp/oci_private_key
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          # Write private key to file
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_private_key
          chmod 600 /tmp/oci_private_key
          
          # Fail if SSH_PUBLIC_KEY is not set
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: SSH_PUBLIC_KEY is not set. Please add it as a GitHub Actions variable."
            exit 1
          fi
          
          # Use fixed bucket name
          BUCKET_NAME="nixos-images"
          cat > terraform.tfvars << EOF
          tenancy_ocid = "$OCI_TENANCY_OCID"
          user_ocid = "$OCI_USER_OCID"
          fingerprint = "$OCI_FINGERPRINT"
          private_key_path = "/tmp/oci_private_key"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$OCI_REGION"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "$BUCKET_NAME"
          ocpus = ${OCPUS}
          memory_in_gbs = ${MEMORY_GB}
          EOF
          
          # Create bucket if it doesn't exist (needed for terraform state backend)
          echo "Ensuring bucket exists for terraform state..."
          BUCKET_OCID=$(oci os bucket get --namespace-name "${OCI_TENANCY_OCID}" --name "${BUCKET_NAME}" --query 'data.id' --raw-output 2>/dev/null || true)
          if [ -z "$BUCKET_OCID" ]; then
            echo "Creating bucket ${BUCKET_NAME}..."
            oci os bucket create --namespace-name "${OCI_TENANCY_OCID}" --name "${BUCKET_NAME}" --compartment-id "${OCI_TENANCY_OCID}" 2>/dev/null || true
            sleep 10
          fi
          
          # Initialize Terraform
          terraform init
          
          # Import existing resources if they exist
          echo "Checking for existing resources..."
          
          # Image
          IMAGE_ID=$(oci compute image list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state AVAILABLE --display-name "NixOS ARM64" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$IMAGE_ID" ]; then
            echo "Importing image: $IMAGE_ID"
            terraform import 'oci_core_image.nixos' "$IMAGE_ID" || true
          fi
          
          # Shape management (if image already has it configured)
          if [ -n "$IMAGE_ID" ]; then
            SHAPE_MGMT=$(oci compute shape-management list-image-compatible-shapes --image-id "$IMAGE_ID" --query 'data[0]["shape-name"]' --raw-output 2>/dev/null || true)
            if [ -n "$SHAPE_MGMT" ]; then
              terraform import 'oci_core_shape_management.nixos_a1_compat' "c/${OCI_TENANCY_OCID}/i/${IMAGE_ID}/s/VM.Standard.A1.Flex" 2>/dev/null || true
            fi
          fi
          
          # Image capability schema
          if [ -n "$IMAGE_ID" ]; then
            CAPS_SCHEMA_ID=$(oci compute image-capability-schema list --compartment-id "${OCI_TENANCY_OCID}" --image-id "$IMAGE_ID" --query 'data[0].id' --raw-output 2>/dev/null || true)
            if [ -n "$CAPS_SCHEMA_ID" ]; then
              echo "Importing image capability schema: $CAPS_SCHEMA_ID"
              terraform import 'oci_core_compute_image_capability_schema.nixos_caps' "$CAPS_SCHEMA_ID" || true
            fi
          fi
          
          # Instance
          INSTANCE_ID=$(oci compute instance list --compartment-id "${OCI_TENANCY_OCID}" --lifecycle-state RUNNING --display-name "nixos" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$INSTANCE_ID" ]; then
            echo "Importing instance: $INSTANCE_ID"
            terraform import 'oci_core_instance.nixos' "$INSTANCE_ID" || true
          fi
          
          # VCN
          VCN_ID=$(oci network vcn list --compartment-id "${OCI_TENANCY_OCID}" --display-name "nixos-vcn" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$VCN_ID" ]; then
            echo "Importing VCN: $VCN_ID"
            terraform import 'oci_core_vcn.nixos' "$VCN_ID" || true
          fi
          
          # Subnet
          SUBNET_ID=$(oci network subnet list --compartment-id "${OCI_TENANCY_OCID}" --display-name "nixos-subnet" --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [ -n "$SUBNET_ID" ]; then
            echo "Importing subnet: $SUBNET_ID"
            terraform import 'oci_core_subnet.nixos' "$SUBNET_ID" || true
          fi
          
          # Apply changes
          terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
