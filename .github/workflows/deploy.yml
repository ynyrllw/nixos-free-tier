name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2.gz \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.05/nixos-image-aarch64-linux.qcow2.gz
          gunzip nixos.qcow2.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          TENANCY_OCID: ${{ vars.TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          REGION: ${{ vars.REGION }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          REGION_VAL="${REGION:-}"
          SUBNET_ID_VAL="${SUBNET_ID:-}"
          cat > terraform.tfvars << 'ENDOFFILE'
          tenancy_ocid = "$TENANCY_OCID"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$REGION_VAL"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ocpus = $OCPUS
          memory_in_gbs = $MEMORY_GB
          ENDOFFILE
          terraform init

      - name: Apply Terraform
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
