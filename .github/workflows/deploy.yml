name: Build and Deploy NixOS to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      ocpus:
        description: 'Number of OCPUs (1-4)'
        required: false
        default: '4'
      memory_gb:
        description: 'Memory in GB (6-24)'
        required: false
        default: '24'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download NixOS ARM image
        run: |
          curl -L -o nixos.qcow2 \
            https://github.com/nix-community/nixos-images/releases/download/nixos-25.11/Image-aarch64-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-qcow2
          path: nixos.qcow2
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NixOS image
        uses: actions/download-artifact@v4
        with:
          name: nixos-qcow2
          path: terraform/

      - name: Rename image file
        run: mv terraform/nixos.qcow2 terraform/nixos-aarch64.qcow2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Terraform
        working-directory: terraform
        env:
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PATH: /tmp/oci_private_key
          TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          OCPUS: ${{ github.event.inputs.ocpus || '4' }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb || '24' }}
        run: |
          # Write private key to file
          echo "$OCI_PRIVATE_KEY" > /tmp/oci_private_key
          chmod 600 /tmp/oci_private_key
          
          # Configure OCI CLI
          mkdir -p ~/.oci
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=/tmp/oci_private_key
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          
          # Get namespace
          NAMESPACE=$(oci os namespace get --query 'data' --raw-output)
          echo "Namespace: $NAMESPACE"
          
          # Fail if SSH_PUBLIC_KEY is not set
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "ERROR: SSH_PUBLIC_KEY is not set. Please add it as a GitHub Actions variable."
            exit 1
          fi
          
          # Use unique bucket name for image (with date to avoid conflicts)
          BUCKET_NAME="nixos-images-$(date +%Y%m%d)"
          cat > terraform.tfvars << EOF
          tenancy_ocid = "$OCI_TENANCY_OCID"
          user_ocid = "$OCI_USER_OCID"
          fingerprint = "$OCI_FINGERPRINT"
          private_key_path = "/tmp/oci_private_key"
          compartment_ocid = "${COMPARTMENT_OCID:-${OCI_TENANCY_OCID}}"
          region = "$OCI_REGION"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "$BUCKET_NAME"
          ocpus = ${OCPUS}
          memory_in_gbs = ${MEMORY_GB}
          EOF
          
          # Create image bucket and wait for it to be available
          echo "Creating image bucket..."
          BUCKET_EXISTS=$(oci os bucket get --namespace-name "${NAMESPACE}" --name "${BUCKET_NAME}" --query 'data.id' --raw-output 2>/dev/null || true)
          if [ -z "$BUCKET_EXISTS" ]; then
            echo "Bucket does not exist, creating..."
            oci os bucket create --namespace-name "${NAMESPACE}" --name "${BUCKET_NAME}" --compartment-id "${OCI_TENANCY_OCID}" || echo "Bucket creation failed"
          else
            echo "Bucket already exists: $BUCKET_EXISTS"
          fi
          echo "Waiting for bucket to be available..."
          for i in {1..30}; do
            BUCKET_STATE=$(oci os bucket get --namespace-name "${NAMESPACE}" --name "${BUCKET_NAME}" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "NOT_FOUND")
            if [ "$BUCKET_STATE" = "ACTIVE" ]; then
              echo "Bucket is active"
              break
            fi
            echo "Waiting... ($BUCKET_STATE)"
            sleep 2
          done
          
          # Initialize Terraform
          terraform init
          
          # Apply changes (state is persisted in nixos-terraform-state bucket)
          terraform apply -auto-approve

      - name: Output instance IP
        working-directory: terraform
        run: |
          echo "Deployment complete!"
          echo "Instance IP: $(terraform output -raw instance_ip)"
