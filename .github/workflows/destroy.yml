name: Destroy NixOS Instance

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'Bucket name (e.g., nixos-images-20260318)'
        required: false
        default: 'nixos-images'

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          TENANCY_OCID: ${{ vars.TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          REGION: ${{ vars.REGION }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: |
          REGION_VAL="${REGION:-}"
          SUBNET_ID_VAL="${SUBNET_ID:-}"
          BUCKET_NAME="${{ github.event.inputs.bucket_name || 'nixos-images' }}"
          cat > terraform.tfvars << 'ENDOFFILE'
          tenancy_ocid = "$TENANCY_OCID"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$REGION_VAL"
          subnet_id = "$SUBNET_ID_VAL"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "$BUCKET_NAME"
          ENDOFFILE
          terraform init

      - name: Destroy Terraform
        working-directory: terraform
        run: terraform destroy -auto-approve
