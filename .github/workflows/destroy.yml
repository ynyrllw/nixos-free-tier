name: Destroy NixOS Instance

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure Terraform
        working-directory: terraform
        env:
          TENANCY_OCID: ${{ vars.TENANCY_OCID }}
          COMPARTMENT_OCID: ${{ vars.COMPARTMENT_OCID }}
          REGION: ${{ vars.REGION }}
          SUBNET_ID: ${{ vars.SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: |
          cat > terraform.tfvars << 'ENDOFFILE'
          tenancy_ocid = "$TENANCY_OCID"
          compartment_ocid = "$COMPARTMENT_OCID"
          region = "$REGION"
          subnet_id = "$SUBNET_ID"
          ssh_public_key = "$SSH_PUBLIC_KEY"
          bucket_name = "nixos-images"
          ENDOFFILE
          terraform init

      - name: Destroy Terraform
        working-directory: terraform
        run: terraform destroy -auto-approve
